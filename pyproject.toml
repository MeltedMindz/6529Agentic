[project]
name = "agent6529"
version = "0.1.0"
description = "6529.io connector for autonomous agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["eth-account>=0.11"]

[project.optional-dependencies]
# Device-key signing needs Ed25519, which the standard library does not have.
# Everything else works without it.
signing = ["cryptography>=42"]

[project.scripts]
"6529" = "agent6529.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
